server:
  port: ${PORT:8080}
spring:
  application:
    name: bookmyshow
  datasource:
    url: jdbc:h2:mem:bms;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
app:
  jwt:
    # Dev-only placeholder. In real deployments set the APP_JWT_SECRET environment variable.
    secret: dev-only-secret-set-APP_JWT_SECRET-in-real-environments
    expiration-ms: 86400000
  seat-lock-minutes: 5
---
# Run with: --spring.profiles.active=mysql
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/bookmyshow?createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD:}